spring.application.name=question-service
server.port=8083

# ---------------------------------------------------------------
# Adaptador de persistencia: jpa | memoria  (prueba de intercambiabilidad)
# En Docker se sobreescribe con la variable SABERPRO_PERSISTENCIA
# ---------------------------------------------------------------
saberpro.persistencia=jpa

# Llamada sincrona al validation-service
saberpro.validacion.habilitada=true
saberpro.validacion.url=http://localhost:8082

# ---------------------------------------------------------------
# Persistencia con base de datos H2 (usada por JpaQuestionAdapter)
# ---------------------------------------------------------------
# En memoria (por defecto):
spring.datasource.url=jdbc:h2:mem:saberprodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# Para persistir en disco (modo archivo), descomentar la siguiente linea:
# spring.datasource.url=jdbc:h2:file:./data/saberprodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Consola web H2 (disponible en http://localhost:8083/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Seeder de datos de prueba
saberpro.seeder.enabled=true

# RabbitMQ (en Docker: SPRING_RABBITMQ_HOST=rabbitmq)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
