spring.application.name=question-service
server.port=8083

# ---------------------------------------------------------------
# Adaptador de persistencia: jpa | memoria  (prueba de intercambiabilidad)
# En Docker se sobreescribe con la variable SABERPRO_PERSISTENCIA
# ---------------------------------------------------------------
saberpro.persistencia=jpa

# Llamada sincrona al validation-service
saberpro.validacion.habilitada=true
saberpro.validacion.url=http://localhost:8082

# H2 en memoria (usado por JpaQuestionAdapter)
spring.datasource.url=jdbc:h2:mem:saberprodb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# RabbitMQ (en Docker: SPRING_RABBITMQ_HOST=rabbitmq)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
