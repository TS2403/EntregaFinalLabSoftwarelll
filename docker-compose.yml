version: '3.8'

# Red virtual aislada: los contenedores se encuentran por nombre de servicio (DNS interno)
networks:
  saberpro-net:
    driver: bridge

services:

  # ---------------- Infraestructura ----------------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: saberpro-rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Dashboard web (guest / guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - saberpro-net

  # ---------------- Microservicios ----------------
  validation-service:
    build: ./validation-service
    container_name: saberpro-validation-service
    ports:
      - "8082:8082"
    networks:
      - saberpro-net

  question-service:
    build: ./question-service
    container_name: saberpro-question-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      # Prueba de intercambiabilidad: jpa | memoria
      - SABERPRO_PERSISTENCIA=jpa
      # Llamada REST sincrona usando el nombre del servicio como host
      - SABERPRO_VALIDACION_URL=http://validation-service:8082
    depends_on:
      rabbitmq:
        condition: service_healthy
      validation-service:
        condition: service_started
    networks:
      - saberpro-net

  lifecycle-service:
    build: ./lifecycle-service
    container_name: saberpro-lifecycle-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - saberpro-net
